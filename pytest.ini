[pytest]
# Los entregables repiten nombres de archivo (test_api.py, test_system.py) en
# carpetas distintas y sin __init__.py. El modo de importación "prepend" de
# pytest colisiona con ellos ("import file mismatch"); el modo importlib deriva
# un nombre único por ruta y evita el choque sin renombrar archivos.
addopts = --import-mode=importlib

# scratch/ es un sandbox gitignoreado (copia del repo), no parte de la suite.
norecursedirs = scratch
